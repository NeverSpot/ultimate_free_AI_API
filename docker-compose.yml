name: gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    ports:
      # Host port 55432, not 5432: a native Windows Postgres service already owns 5432.
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # One-shot schema migration. `src/index.ts` never migrates on boot, so without
  # this the gateway starts against an empty database and every auth/key route 500s.
  # Idempotent: already-recorded versions are skipped.
  migrate:
    build: .
    profiles: ['app']
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Container-to-container inside the compose network: INTERNAL 5432, NOT host 55432.
      - DATABASE_URL=postgresql://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway

  gateway:
    build: .
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Container-to-container inside the compose network: INTERNAL 5432, NOT host 55432.
      - DATABASE_URL=postgresql://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      - REDIS_URL=redis://redis:6379
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Development defaults so `docker compose --profile app up` and `npm run db:up`
      # work on a fresh clone. Production MUST use docker-compose.prod.yml, which
      # sets NODE_ENV=production and fails hard on any missing secret.
      - NODE_ENV=${NODE_ENV:-development}
      - SSE_HEADERS_ENABLED=true

      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-admin-token}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-dev-only-master-encryption-key-32ch}
      - JWT_SECRET=${JWT_SECRET:-dev-only-jwt-signing-secret-32-chars}

      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-console}
      - MAIL_FROM=${MAIL_FROM:-Ultimate Free AI <no-reply@localhost>}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}

      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - OAUTH_CALLBACK_BASE=${OAUTH_CALLBACK_BASE:-http://localhost:8080}

      # Optional: leaving these empty disables the matching OAuth provider.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    ports:
      # Loopback only: nginx is the sole public ingress. Compose cannot remove a
      # published port in an overlay, so the base file must already bind to 127.0.0.1.
      - '127.0.0.1:${PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ['app']
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
