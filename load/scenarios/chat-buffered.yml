# Buffered chat completion flow scenario
scenario:
  - think: 1
  - post:
      url: '/v1/chat/completions'
      headers:
        Authorization: 'Bearer dummy-token'
      beforeRequest: 'setLogNormalPrompt'
      afterResponse: 'recordOverhead'
      json:
        model: 'gpt-4o-mini'
        messages:
          - role: 'user'
            content: '{{ $randomString(100, 2000) }}'
        stream: false
      capture:
        - json: '$.usage.total_tokens'
          as: 'totalTokens'
      expect:
        - statusCode: 200

flow:
  - think: 1
  - post:
      url: '/v1/chat/completions'
      headers:
        Authorization: 'Bearer dummy-token'
      beforeRequest: 'setLogNormalPrompt'
      afterResponse: 'recordOverhead'
      json:
        model: 'gpt-4o-mini'
        messages:
          - role: 'user'
            content: '{{ $randomString(100, 2000) }}'
        stream: false
      capture:
        - json: '$.usage.total_tokens'
          as: 'totalTokens'
      expect:
        - statusCode: 200
